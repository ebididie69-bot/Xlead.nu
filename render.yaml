databases:
  - name: leadforge-db
    plan: free
    databaseName: leadforge
    user: leadforge

services:
  - type: web
    name: leadforge-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadforge-db
          property: connectionString
      - key: MASTER_KEY
        sync: false   # generate locally, paste into Render's dashboard — never commit secrets
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false   # your Vercel URL, e.g. https://leadforge-ai.vercel.app (no trailing slash)
      - key: ENV
        value: production
